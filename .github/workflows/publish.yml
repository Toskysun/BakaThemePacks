name: 发布到 v2/prod
on:
  push:
    branches: [v2/source]
  workflow_dispatch:

jobs:
  publish:
    name: 打包并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout v2/source
        uses: actions/checkout@v4
        with:
          ref: v2/source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate all themes
        run: node .scripts/validate.mjs

      - name: Run publish
        run: node .scripts/publish.mjs

      - name: Deploy to v2/prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/publish-output
          cp -r .publish/* /tmp/publish-output/
          cp meta.json /tmp/meta.json.updated

          git stash --include-untracked

          git fetch origin v2/prod || true
          if git show-ref --verify --quiet refs/remotes/origin/v2/prod; then
            git checkout v2/prod
            git rm -rf . || true
          else
            git checkout --orphan v2/prod
            git rm -rf . || true
          fi

          git clean -fdx
          cp -r /tmp/publish-output/* .

          git add .
          git commit -m "Publish: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push origin v2/prod --force

      - name: Update meta.json on v2/source
        run: |
          git checkout v2/source
          git stash pop || true
          cp /tmp/meta.json.updated meta.json
          if [ -n "$(git diff --name-only meta.json 2>/dev/null)" ]; then
            git add meta.json
            git commit -m "chore: update meta.json"
            git push origin v2/source
          fi
